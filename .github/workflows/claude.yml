name: Claude Code

on:
  workflow_dispatch:

  # @claude commands on Issues
  issue_comment:
    types: [created]

  # @claude commands on PR comments
  pull_request_review_comment:
    types: [created]

  # PR review / Request changes
  pull_request_review:
    types: [submitted]

  # Issue creation / assignment
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||

      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@claude')) ||

      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||

      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       contains(github.event.review.body, '@claude')) ||

      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-4-5
          additional_permissions: |
            actions: read

      - name: Commit and Push Branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if repo has any commits at all
          if ! git rev-parse HEAD > /dev/null 2>&1; then
            echo "⚠️ Repository is empty or HEAD does not exist yet — skipping commit"
            exit 0
          fi

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $BRANCH"

          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            echo "Changes detected, committing..."
            git add -A
            git commit -m "Claude: auto-commit changes on $BRANCH"
            git push origin "$BRANCH"
            echo "✅ Committed and pushed to $BRANCH"
          else
            echo "No changes to commit"
          fi
