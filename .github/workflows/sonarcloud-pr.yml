name: SonarCloud PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  sonarcloud:
    name: Analyze PR with SonarCloud
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: Validate SonarCloud configuration
        run: |
          test -n "${{ secrets.SONAR_TOKEN }}" || (echo "Missing required secret: SONAR_TOKEN" && exit 1)

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=almcybage
            -Dsonar.projectKey=almcybage_sast
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.github.summary_comment=true

      - name: Build SonarCloud PR decoration comment
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: almcybage_sast
          SONAR_HOST_URL: https://sonarcloud.io
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - << 'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import base64

          host = os.environ["SONAR_HOST_URL"]
          project = os.environ["SONAR_PROJECT_KEY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["SONAR_TOKEN"]
          dashboard_url = f"{host}/dashboard?id={project}&pullRequest={pr}"

          report_task_file = ".scannerwork/report-task.txt"
          ce_task_id = None
          if os.path.exists(report_task_file):
            values = {}
            with open(report_task_file, "r", encoding="utf-8") as f:
              for line in f:
                if "=" in line:
                  k, v = line.strip().split("=", 1)
                  values[k] = v
            ce_task_id = values.get("ceTaskId")
            host = values.get("serverUrl", host)
            project = values.get("projectKey", project)
            dashboard_url = values.get("dashboardUrl", dashboard_url)

          def call(path, params=None):
            query = ""
            if params:
              query = "?" + urllib.parse.urlencode(params, safe=",")
            url = f"{host}{path}{query}"
            req = urllib.request.Request(url)
            auth = (token + ":").encode("utf-8")
            req.add_header("Authorization", "Basic " + base64.b64encode(auth).decode("utf-8"))
            with urllib.request.urlopen(req, timeout=30) as resp:
              return json.loads(resp.read().decode("utf-8"))

          if ce_task_id:
            for _ in range(40):
              ce = call("/api/ce/task", {"id": ce_task_id})
              status = ce.get("task", {}).get("status")
              if status in ("SUCCESS", "FAILED", "CANCELED"):
                break
              time.sleep(3)

          metrics = {}
          quality = "UNKNOWN"
          total = 0
          top_issues = []
          type_counts = {"BUG": "0", "VULNERABILITY": "0", "CODE_SMELL": "0"}
          severity_totals = {"BLOCKER": "0", "CRITICAL": "0", "MAJOR": "0"}
          new_coverage = None
          new_duplication = None
          new_duplicated_lines = "0"
          new_hotspots = "0"

          for attempt in range(10):
            measures = call(
              "/api/measures/component",
              {
                "component": project,
                "pullRequest": pr,
                "metricKeys": "alert_status,new_bugs,new_vulnerabilities,new_code_smells,new_security_hotspots,new_coverage,new_duplicated_lines_density,new_duplicated_lines",
              },
            )
            issues = call(
              "/api/issues/search",
              {
                "componentKeys": project,
                "pullRequest": pr,
                "types": "BUG,VULNERABILITY,CODE_SMELL",
                "ps": "5",
                "s": "SEVERITY",
              },
            )
            issue_counts = call(
              "/api/issues/search",
              {
                "componentKeys": project,
                "pullRequest": pr,
                "types": "BUG,VULNERABILITY,CODE_SMELL",
                "facets": "types",
                "ps": "1",
              },
            )
            severity_counts = call(
              "/api/issues/search",
              {
                "componentKeys": project,
                "pullRequest": pr,
                "types": "BUG,VULNERABILITY,CODE_SMELL",
                "facets": "severities",
                "ps": "1",
              },
            )
            quality_gate = call(
              "/api/qualitygates/project_status",
              {
                "projectKey": project,
                "pullRequest": pr,
              },
            )

            metrics = {m["metric"]: m.get("value", "-") for m in measures.get("component", {}).get("measures", [])}
            quality = quality_gate.get("projectStatus", {}).get("status") or metrics.get("alert_status", "UNKNOWN")
            total = issues.get("total", 0)
            top_issues = issues.get("issues", [])

            type_counts = {"BUG": "0", "VULNERABILITY": "0", "CODE_SMELL": "0"}
            for facet in issue_counts.get("facets", []):
              if facet.get("property") == "types":
                for val in facet.get("values", []):
                  key = val.get("val")
                  if key in type_counts:
                    type_counts[key] = str(val.get("count", 0))

            severity_totals = {"BLOCKER": "0", "CRITICAL": "0", "MAJOR": "0"}
            for facet in severity_counts.get("facets", []):
              if facet.get("property") == "severities":
                for val in facet.get("values", []):
                  key = val.get("val")
                  if key in severity_totals:
                    severity_totals[key] = str(val.get("count", 0))

            new_coverage = metrics.get("new_coverage")
            new_duplication = metrics.get("new_duplicated_lines_density")
            new_duplicated_lines = metrics.get("new_duplicated_lines", "0")
            new_hotspots = metrics.get("new_security_hotspots", "0")

            if quality != "UNKNOWN" or total > 0:
              break
            if attempt < 9:
              time.sleep(5)

          lines = []
          lines.append("<!-- sonar-pr-decoration -->")
          lines.append("## SonarCloud PR Analysis")
          lines.append("")
          lines.append(f"- Quality Gate: **{quality}**")
          lines.append(f"- New Bugs: **{type_counts['BUG']}**")
          lines.append(f"- New Vulnerabilities: **{type_counts['VULNERABILITY']}**")
          lines.append(f"- New Code Smells: **{type_counts['CODE_SMELL']}**")
          lines.append(f"- New Security Hotspots: **{new_hotspots}**")
          lines.append(f"- Severity Totals (BLOCKER/CRITICAL/MAJOR): **{severity_totals['BLOCKER']}/{severity_totals['CRITICAL']}/{severity_totals['MAJOR']}**")
          lines.append(f"- New Coverage: **{new_coverage + '%' if new_coverage is not None else 'N/A'}**")
          lines.append(f"- New Duplicated Lines: **{new_duplicated_lines}**")
          lines.append(f"- New Duplication: **{new_duplication + '%' if new_duplication is not None else 'N/A'}**")
          lines.append("")
          lines.append(f"Total new issues in PR: **{total}**")

          if top_issues:
              lines.append("")
              lines.append("### Top Sonar Issues")
              for item in top_issues:
                  rule = item.get("rule", "unknown")
                  sev = item.get("severity", "-")
                  typ = item.get("type", "-")
                  msg = item.get("message", "").replace("\n", " ")
                  lines.append(f"- [{typ}/{sev}] {msg} (`{rule}`)")

          lines.append("")
          lines.append(f"[Open full SonarCloud PR dashboard]({dashboard_url})")

          with open("sonar_pr_comment.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Publish SonarCloud PR decoration comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sonar-pr-decoration -->';
            const body = fs.readFileSync('sonar_pr_comment.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
